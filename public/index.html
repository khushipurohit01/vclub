<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V-Club — Assignments</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eee5d5;--ink:#1f1b17;--muted:#746b61;--accent:#a84530;--line:#d3c8b8;--card:#f7f1e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.wrap{max-width:1180px;margin:auto;padding:42px 28px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-weight:700;letter-spacing:.14em;font-size:13px}.admin{color:var(--muted);font-size:13px;text-decoration:none}.hero{padding:72px 0 54px;max-width:850px}.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase}.hero h1{font:700 clamp(52px,8vw,100px)/.92 "Playfair Display",serif;margin:16px 0 22px;letter-spacing:-.045em}.hero p{font-size:18px;line-height:1.65;color:var(--muted);max-width:660px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);padding:26px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit;transition:.2s transform,.2s box-shadow}.card:hover{transform:translateY(-3px);box-shadow:0 16px 35px #6d5b3d18}.num{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.14em}.card h2{font:700 34px/1.03 "Playfair Display",serif;margin:34px 0 12px}.card p{margin:0;color:var(--muted);line-height:1.5}.arrow{margin-top:25px;font-size:13px;font-weight:700}.empty{border:1px dashed var(--line);padding:48px;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:55px;padding-top:18px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}@media(max-width:700px){.wrap{padding:25px 18px 45px}.hero{padding:55px 0 38px}.grid{grid-template-columns:1fr}.card h2{font-size:29px}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand">V-CLUB</div><a class="admin" href="/admin">Admin</a></header>
<section class="hero"><div class="eyebrow">Editing & Design Assignments</div><h1>Make. Think.<br>Improve.</h1><p>A growing library of V-Club creative assignments. Open an assignment, study the brief, and make something worth showing.</p></section>
<section id="list" class="grid"></section><footer><span>V-CLUB</span><span id="count"></span></footer></main>
<script>
const list=document.querySelector('#list'),count=document.querySelector('#count');
async function load(){try{const r=await fetch('/api/assignments',{cache:'no-store'});if(!r.ok)throw new Error('Request failed');const d=await r.json();const items=(d.assignments||[]).sort((a,b)=>a.order-b.order);count.textContent=`${items.length} assignment${items.length===1?'':'s'}`;if(!items.length){list.className='';list.innerHTML='<div class="empty">No assignments have been published yet.</div>';return}list.innerHTML=items.map((a,i)=>`<a class="card" href="/assignment.html?id=${encodeURIComponent(a.id)}"><div><div class="num">${String(i+1).padStart(2,'0')}</div><h2>${esc(a.title)}</h2><p>${esc(a.description||'Creative brief')}</p></div><div class="arrow">OPEN ASSIGNMENT →</div></a>`).join('')}catch(e){list.className='';list.innerHTML='<div class="empty">Could not load assignments.</div>'}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
