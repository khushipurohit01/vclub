<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-Club Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eee5d5;--ink:#1f1b17;--muted:#746b61;--accent:#a84530;--line:#d3c8b8;--card:#f7f1e7;--white:#fffaf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}.shell{max-width:1100px;margin:auto;padding:30px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:700;letter-spacing:.15em;font-size:13px}.toplinks{display:flex;gap:18px}.toplinks button,.toplinks a{background:none;border:0;color:var(--muted);font:500 13px inherit;text-decoration:none;cursor:pointer}.hero{padding:55px 0 35px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700}.hero h1{font:700 58px/.95 "Playfair Display",serif;margin:12px 0}.hero p{color:var(--muted);margin:0}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:25px 0 15px}.toolbar h2{font:700 24px "Playfair Display",serif}.primary{border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:2px;font:700 12px inherit;letter-spacing:.08em;cursor:pointer}.list{display:flex;flex-direction:column;gap:10px}.row{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);padding:16px;cursor:grab}.row.dragging{opacity:.45}.handle{font-size:20px;color:var(--muted);text-align:center}.meta h3{margin:0 0 5px;font-size:17px}.meta p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px}.actions button{border:1px solid var(--line);background:var(--white);padding:8px 11px;cursor:pointer;font:600 11px inherit}.actions .danger{color:var(--accent)}.modal{position:fixed;inset:0;background:#211a14aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.panel{width:min(580px,100%);background:var(--card);padding:28px;border:1px solid var(--line);box-shadow:0 25px 70px #0003}.panel h2{font:700 30px "Playfair Display",serif;margin:0 0 20px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--white);padding:12px;font:15px inherit;color:var(--ink);outline:none}.field textarea{min-height:85px;resize:vertical}.drop{border:1.5px dashed #b7aa99;background:#fdf7ee;padding:28px;text-align:center;color:var(--muted);cursor:pointer}.drop.over{border-color:var(--accent);background:#f7e9df}.drop strong{display:block;color:var(--ink);margin-bottom:5px}.filename{margin-top:8px;font-size:12px;color:var(--accent)}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.secondary{border:1px solid var(--line);background:transparent;padding:11px 15px;cursor:pointer;font-weight:600}.notice{position:fixed;right:20px;bottom:20px;background:var(--ink);color:white;padding:12px 16px;font-size:13px;display:none;z-index:20}.notice.show{display:block}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--card);padding:36px;border:1px solid var(--line)}.loginbox h1{font:700 45px "Playfair Display",serif;margin:8px 0 12px}.loginbox p{color:var(--muted);line-height:1.5}.loginbox input{width:100%;padding:13px;border:1px solid var(--line);background:var(--white);font:16px inherit}.loginbox button{width:100%;margin-top:12px}.hint{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:650px){.hero h1{font-size:45px}.row{grid-template-columns:28px 1fr}.actions{grid-column:2}.toolbar{align-items:flex-start;gap:12px}.toolbar .primary{white-space:nowrap}}
</style></head>
<body><div id="app"></div><div id="notice" class="notice"></div>
<div id="modal" class="modal"><div class="panel"><h2 id="modalTitle">Add assignment</h2><form id="form"><div class="field"><label>Assignment name</label><input id="title" required maxlength="120" placeholder="e.g. Typography Challenge"></div><div class="field"><label>Short description</label><textarea id="description" maxlength="300" placeholder="One sentence describing the brief"></textarea></div><div id="uploadField" class="field"><label>HTML file</label><input id="file" type="file" accept=".html,.htm,text/html" hidden><div id="drop" class="drop"><strong>Drop your HTML file here</strong><span>or click to browse</span><div id="filename" class="filename"></div></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" id="submit">Add assignment</button></div></form></div></div>
<script>
const app=document.querySelector('#app'),modal=document.querySelector('#modal'),form=document.querySelector('#form'),title=document.querySelector('#title'),description=document.querySelector('#description'),file=document.querySelector('#file'),drop=document.querySelector('#drop'),filename=document.querySelector('#filename'),submit=document.querySelector('#submit'),notice=document.querySelector('#notice');let selectedFile=null,items=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(t){notice.textContent=t;notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),2600)}
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
async function boot(){try{const s=await api('/api/session');if(!s.authenticated){renderLogin();return}renderAdmin();await load()}catch(err){app.innerHTML='<main class="login"><section class="loginbox"><div class="brand">V-CLUB / ADMIN</div><h1>Could not connect.</h1><p>'+esc(err.message)+'</p><button class="primary" onclick="location.reload()">Try again</button></section></main>'}}
function renderLogin(){app.innerHTML='<main class="login"><section class="loginbox"><div class="brand">V-CLUB / ADMIN</div><h1>Welcome back.</h1><p>Enter the private admin password to manage assignments.</p><form id="loginForm"><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="primary">Enter admin</button></form><div class="hint">The password is set once in Netlify. You do not need GitHub to manage assignments.</div></section></main>';document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});location.reload()}catch(err){flash(err.message)}}}
function renderAdmin(){app.innerHTML='<main class="shell"><header class="top"><div class="brand">V-CLUB / ADMIN</div><nav class="toplinks"><a href="/" target="_blank">View site ↗</a><button id="logout">Log out</button></nav></header><section class="hero"><div class="eyebrow">Assignment Manager</div><h1>Keep it simple.</h1><p>Upload one finished HTML file, name it, then drag assignments into the order you want students to see.</p></section><section class="toolbar"><h2>Assignments</h2><button class="primary" id="add">+ Add assignment</button></section><section id="list" class="list"></section></main>';document.querySelector('#add').onclick=()=>openAdd();document.querySelector('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()}}
async function load(){const d=await api('/api/assignments?admin=1');items=(d.assignments||[]).sort((a,b)=>a.order-b.order);renderList()}
function renderList(){const list=document.querySelector('#list');if(!items.length){list.innerHTML='<div class="row" style="display:block;color:#746b61">No assignments yet. Add your first HTML presentation.</div>';return}list.innerHTML=items.map((a,i)=>`<article class="row" draggable="true" data-id="${a.id}"><div class="handle">☰</div><div class="meta"><h3>${String(i+1).padStart(2,'0')} — ${esc(a.title)}</h3><p>${esc(a.description||'No description')}</p></div><div class="actions"><button data-act="preview">Preview</button><button data-act="edit">Edit</button><button class="danger" data-act="delete">Delete</button></div></article>`).join('');document.querySelectorAll('.row').forEach(row=>{row.addEventListener('dragstart',()=>{row.classList.add('dragging')});row.addEventListener('dragend',async()=>{row.classList.remove('dragging');await saveOrder()});row.addEventListener('dragover',e=>{e.preventDefault();const drag=document.querySelector('.dragging');if(drag&&drag!==row){const box=row.getBoundingClientRect();const after=e.clientY-box.top>box.height/2;row.parentNode.insertBefore(drag,after?row.nextSibling:row)}});row.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.dataset.act,row.dataset.id)})})}
async function saveOrder(){const ids=[...document.querySelectorAll('.row')].map(x=>x.dataset.id);try{const d=await api('/api/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});items=d.assignments;renderList();flash('Order saved.')}catch(e){flash(e.message);await load()}}
function openAdd(){selectedFile=null;file.value='';delete modal.dataset.edit;title.value='';description.value='';filename.textContent='';document.querySelector('#uploadField').style.display='block';submit.textContent='Add assignment';document.querySelector('#modalTitle').textContent='Add assignment';modal.classList.add('show')}
function openEdit(id){const a=items.find(x=>x.id===id);if(!a)return;selectedFile=null;file.value='';title.value=a.title;description.value=a.description||'';document.querySelector('#uploadField').style.display='none';submit.textContent='Save changes';document.querySelector('#modalTitle').textContent='Edit assignment';modal.dataset.edit=id;modal.classList.add('show')}
function close(){modal.classList.remove('show');delete modal.dataset.edit}
modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))close()});document.querySelector('#cancel').onclick=close;drop.onclick=()=>file.click();file.onchange=()=>{selectedFile=file.files[0];filename.textContent=selectedFile?selectedFile.name:''};['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f){selectedFile=f;filename.textContent=f.name}});
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(modal.dataset.edit){const d=await api('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:modal.dataset.edit,title:title.value,description:description.value})});const idx=items.findIndex(x=>x.id===modal.dataset.edit);items[idx]=d.assignment;close();renderList();flash('Assignment updated.')}else{if(!selectedFile)throw new Error('Drop an HTML file first.');const fd=new FormData();fd.append('title',title.value);fd.append('description',description.value);fd.append('file',selectedFile);const d=await api('/api/upload',{method:'POST',body:fd});items.push(d.assignment);items.sort((a,b)=>a.order-b.order);close();renderList();flash('Assignment added.')}}catch(err){flash(err.message)}finally{submit.disabled=false}};
async function act(type,id){const a=items.find(x=>x.id===id);if(type==='preview'){window.open('/assignment.html?id='+encodeURIComponent(id),'_blank');return}if(type==='edit'){openEdit(id);return}if(type==='delete'){if(!confirm(`Delete “${a.title}”? This cannot be undone.`))return;try{await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});await load();flash('Assignment deleted.')}catch(e){flash(e.message)}}}
boot();
</script></body></html>
