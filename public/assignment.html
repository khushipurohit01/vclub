<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V-Club Assignment</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee5d5}iframe{width:100%;height:100%;border:0;display:block}.state{position:fixed;inset:0;display:grid;place-items:center;font:500 14px system-ui,sans-serif;color:#746b61}.state.error{color:#a84530}</style></head><body><div id="state" class="state">Loading assignment…</div><iframe id="frame" title="V-Club assignment" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-presentation allow-downloads" hidden></iframe><script>const params=new URLSearchParams(location.search),id=params.get('id'),frame=document.querySelector('#frame'),state=document.querySelector('#state');if(!id){location.replace('/')}else{const src='/api/assignment?id='+encodeURIComponent(id);fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Assignment not found');frame.src=src;frame.onload=()=>{state.hidden=true;frame.hidden=false}}).catch(()=>{state.textContent='Could not load this assignment.';state.className='state error'})}</script></body></html>
